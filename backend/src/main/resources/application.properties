spring.application.name=recall

spring.datasource.url=jdbc:h2:file:~/recall-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Recall tuning -------------------------------------------------------
# Exponential decay rate applied to a solution's age since last success.
recall.decay.lambda=0.05
# MaxHeap scoring weights: success rate / usage frequency / feedback score.
recall.heap.weights.w1=0.5
recall.heap.weights.w2=0.3
recall.heap.weights.w3=0.2
# Normalisation divisor turning a raw usage count into a 0..1 frequency term.
recall.heap.frequency-saturation=10.0
# Token-overlap similarity above which two signatures auto-link in the graph.
recall.graph.fuzzy-threshold=0.6
